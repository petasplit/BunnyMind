name: BunnyMind Windows x64 build
on:
  push:
    branches: ["bunnymind/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build web dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Embed web assets
        run: |
          mkdir -p internal/server/dist
          cp -r web/dist/. internal/server/dist/
      - name: Cross-compile Windows x64 executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          find web/dist/assets -maxdepth 1 -name 'ChatPage-*.js' -printf '%f\n' > dist/CHAT_CHUNKS.txt
          test -s dist/CHAT_CHUNKS.txt
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-windows-x64.exe ./cmd/antares
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-authz-demo-windows-x64.exe ./cmd/bunnyauthz-demo
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-fix-demo-windows-x64.exe ./cmd/bunnyfix-demo
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-authflow-demo-windows-x64.exe ./cmd/bunny-authflow-demo
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-python-proof-windows-x64.exe ./cmd/bunny-python-proof
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-adaptive-proof-windows-x64.exe ./cmd/bunny-adaptive-proof
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-program-intake-windows-x64.exe ./cmd/bunny-program-intake
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-scoped-crawl-windows-x64.exe ./cmd/bunny-scoped-crawl
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-headless-crawl-windows-x64.exe ./cmd/bunny-headless-crawl
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-approved-auth-windows-x64.exe ./cmd/bunny-approved-auth
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-evidence-judge-windows-x64.exe ./cmd/bunny-evidence-judge
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-browser-replay-windows-x64.exe ./cmd/bunny-browser-replay
          go build -trimpath -ldflags "-s -w" -o dist/BunnyMind-specialist-sandbox-windows-x64.exe ./cmd/bunny-specialist-sandbox
          bun build --compile --target=bun-windows-x64 ./web/scripts/bunnymind_ast.mjs --outfile dist/BunnyMind-js-ast-windows-x64.exe
          (cd dist && sha256sum BunnyMind-windows-x64.exe BunnyMind-authz-demo-windows-x64.exe BunnyMind-fix-demo-windows-x64.exe BunnyMind-authflow-demo-windows-x64.exe BunnyMind-python-proof-windows-x64.exe BunnyMind-adaptive-proof-windows-x64.exe BunnyMind-program-intake-windows-x64.exe BunnyMind-scoped-crawl-windows-x64.exe BunnyMind-headless-crawl-windows-x64.exe BunnyMind-approved-auth-windows-x64.exe BunnyMind-evidence-judge-windows-x64.exe BunnyMind-browser-replay-windows-x64.exe BunnyMind-specialist-sandbox-windows-x64.exe BunnyMind-js-ast-windows-x64.exe > SHA256SUMS.txt)
      - name: Upload test build (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: BunnyMind-windows-x64-ci
          path: |
            dist/BunnyMind-windows-x64.exe
            dist/BunnyMind-authz-demo-windows-x64.exe
            dist/BunnyMind-fix-demo-windows-x64.exe
            dist/BunnyMind-authflow-demo-windows-x64.exe
            dist/BunnyMind-python-proof-windows-x64.exe
            dist/BunnyMind-adaptive-proof-windows-x64.exe
            dist/BunnyMind-program-intake-windows-x64.exe
            dist/BunnyMind-scoped-crawl-windows-x64.exe
            dist/BunnyMind-headless-crawl-windows-x64.exe
            dist/BunnyMind-approved-auth-windows-x64.exe
            dist/BunnyMind-evidence-judge-windows-x64.exe
            dist/BunnyMind-browser-replay-windows-x64.exe
            dist/BunnyMind-specialist-sandbox-windows-x64.exe
            dist/BunnyMind-js-ast-windows-x64.exe
            dist/SHA256SUMS.txt
            dist/CHAT_CHUNKS.txt
          retention-days: 7

  windows-native-smoke:
    needs: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Windows executables
        uses: actions/download-artifact@v4
        with:
          name: BunnyMind-windows-x64-ci
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run native Windows adaptive Python evidence, keyring and seal integration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python).Source
          $guard = Join-Path $PWD 'tests/fixtures/guard-loopback.json'
          $spec = Join-Path $PWD 'tests/fixtures/adaptive-loopback.json'
          $serverSource = Join-Path $PWD 'tests/fixtures/bunnymind_local_fixture.py'
          $proofExe = Join-Path $PWD 'dist/BunnyMind-python-proof-windows-x64.exe'
          $adaptiveExe = Join-Path $PWD 'dist/BunnyMind-adaptive-proof-windows-x64.exe'
          $vault = Join-Path $env:RUNNER_TEMP 'bunnymind-python-vault'
          $srv = Start-Process -FilePath $python -ArgumentList @('-u', $serverSource, '--port', '18786') -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              if ($srv.HasExited) { throw 'Local Python fixture stopped before verification' }
              try {
                $health = Invoke-WebRequest -Uri 'http://127.0.0.1:18786/health' -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Local fixture did not become healthy' }
            & $proofExe --init-key
            if ($LASTEXITCODE -ne 0) { throw 'Evidence encryption key enrollment failed on Windows' }
            $raw = & $adaptiveExe --guard $guard --spec $spec --out $vault --python $python
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows adaptive proof runner failed' }
            $campaign = ($raw -join "`n") | ConvertFrom-Json
            if ($campaign.outcome -ne 'replicated_observation_unverified' -or
                $campaign.requests_used -ne 12 -or $campaign.runs.Count -ne 3) {
              throw 'Adaptive proof fixture did not repeat the expected controlled response with negative controls'
            }
            foreach ($run in $campaign.runs) {
              $round = Join-Path (Join-Path $vault 'bunnymindlocal01') $run.run_id
              foreach ($name in @('scenario.py', 'plan.json', 'validation.json', 'transcript.enc', 'seal.json')) {
                if (-not (Test-Path (Join-Path $round $name))) { throw "Missing sealed proof artifact: $($run.run_id)/$name" }
              }
            }
            Write-Host 'PASS: Windows keyring, Python 3, adaptive HTTP controls, generated scripts, encrypted evidence and audit seals'
          } finally {
            if (-not $srv.HasExited) { Stop-Process -Id $srv.Id -Force }
          }
      - name: Verify Windows scoped crawler against a disposable localhost fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python).Source
          $fixture = Join-Path $PWD 'tests/fixtures/bunnymind_local_fixture.py'
          $guard = Join-Path $PWD 'tests/fixtures/guard-loopback.json'
          $exe = Join-Path $PWD 'dist/BunnyMind-scoped-crawl-windows-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Scoped crawler Windows EXE missing' }
          $root = Join-Path $env:RUNNER_TEMP 'bunnymind-crawler-native'
          $srv = Start-Process -FilePath $python -ArgumentList @('-u',$fixture,'--port','18786') -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              try {
                $res = Invoke-WebRequest 'http://127.0.0.1:18786/health' -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -eq 200) { $ready=$true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Crawler fixture failed to start' }
            $raw = & $exe --guard $guard --url 'http://127.0.0.1:18786/health' --max-pages 2 --depth 1 --out $root
            if ($LASTEXITCODE -ne 0) { throw 'Scoped crawler EXE exited unsuccessfully' }
            $report = ($raw -join "`n") | ConvertFrom-Json
            if ($report.requests_used -ne 1 -or $report.pages.Count -ne 1 -or
                $report.pages[0].status -ne 200 -or $report.stop_reason -ne 'frontier_exhausted') {
              throw 'Unexpected crawler result from disposable localhost fixture'
            }
            $receipts = @(Get-ChildItem $root -Filter 'crawl.json' -Recurse -ErrorAction SilentlyContinue)
            if ($receipts.Count -ne 1) { throw 'Crawler did not preserve exactly one private receipt' }
            Write-Host 'PASS: Windows crawler bounded GET, scope, local fixture and private evidence receipt'
          } finally {
            if (-not $srv.HasExited) { Stop-Process -Id $srv.Id -Force }
          }
      - name: Check bundled JavaScript AST and source-map analyzer on Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/BunnyMind-js-ast-windows-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Standalone AST parser missing' }
          $source = Join-Path $PWD 'tests/fixtures/ast_sample.js'
          $map = Join-Path $PWD 'tests/fixtures/ast_sample.js.map'
          $raw = & $exe --file $source --origin https://approved.example --map $map
          if ($LASTEXITCODE -ne 0) { throw 'Standalone AST parser failed on Windows' }
          $parsed = ($raw -join "`n") | ConvertFrom-Json
          if ($parsed.source_map.status -ne 'verified_map_metadata' -or $parsed.source_map.attributed -lt 1) {
            throw 'AST parser did not verify source-map provenance'
          }
          if (($parsed.endpoints | Where-Object { $_.path -eq '/api/profile' }).Count -lt 1 -or
              ($parsed.endpoints | Where-Object { $_.path -eq '/api/update' }).Count -lt 1) {
            throw 'AST parser failed to discover synthetic fetch/axios endpoints'
          }
          if (($raw -join "") -match 'SECRET_LOCAL_VALUE') { throw 'AST parser leaked a query secret' }
          Write-Host 'PASS: compiled Windows AST endpoint inventory and verified source-map provenance'
      - name: Launch actual BunnyMind Windows server and verify embedded dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/BunnyMind-windows-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Main BunnyMind executable is missing' }
          $version = (& $exe version | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $version.Trim()) { throw 'Main executable version command failed' }
          $helpText = (& $exe help | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $helpText.Contains('setup')) { throw 'Main executable help command failed' }
          $env:ANTARES_HOME = Join-Path $env:RUNNER_TEMP 'bunnymind-native-smoke-home'
          $env:ANTARES_HOST = '127.0.0.1'
          $env:ANTARES_PORT = '18787'
          $env:ANTARES_DISABLE_MODELS_FETCH = '1'
          $outFile = Join-Path $env:RUNNER_TEMP 'bunnymind-main-stdout.log'
          $errFile = Join-Path $env:RUNNER_TEMP 'bunnymind-main-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--foreground' -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw 'Main BunnyMind process exited before health check' }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18787/api/health' -TimeoutSec 2
                if ($health.ok -eq $true) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              Get-Content $outFile -ErrorAction SilentlyContinue | Select-Object -Last 20
              Get-Content $errFile -ErrorAction SilentlyContinue | Select-Object -Last 20
              throw 'Main server never became healthy'
            }
            $dashboard = Invoke-WebRequest -Uri 'http://127.0.0.1:18787/' -UseBasicParsing -TimeoutSec 10
            if ($dashboard.StatusCode -ne 200 -or -not $dashboard.Content) {
              throw 'Embedded web dashboard was not served successfully'
            }
            $chunks = @(Get-Content (Join-Path $PWD 'dist/CHAT_CHUNKS.txt') | Where-Object { $_.Trim() })
            if ($chunks.Count -lt 1) { throw 'No ChatPage dynamic-import chunks in Windows build' }
            foreach ($chunk in $chunks) {
              $asset = Invoke-WebRequest -Uri ("http://127.0.0.1:18787/assets/" + $chunk) -UseBasicParsing -TimeoutSec 15
              if ($asset.StatusCode -ne 200 -or
                  $asset.Headers['Content-Type'] -notmatch 'javascript' -or
                  $asset.Content -match '<!doctype html>') {
                throw "ChatPage asset $chunk was not served as a JavaScript module"
              }
            }
            $staleAsset = Invoke-WebRequest -Uri 'http://127.0.0.1:18787/assets/ChatPage-nonexistent.js' -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 15
            if ($staleAsset.StatusCode -ne 404 -or $staleAsset.Content -match '<!doctype html>') {
              throw 'A missing hashed JavaScript module was incorrectly replaced by SPA HTML'
            }
            Write-Host 'PASS: Actual Windows x64 backend started, served healthy API, embedded dashboard and dynamic ChatPage JavaScript chunks'

          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Start and stop the actual BunnyMind Windows background daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/BunnyMind-windows-x64.exe'
          $env:ANTARES_HOME = Join-Path $env:RUNNER_TEMP 'bunnymind-daemon-smoke-home'
          $env:ANTARES_HOST = '127.0.0.1'
          $env:ANTARES_PORT = '18788'
          $env:ANTARES_DISABLE_MODELS_FETCH = '1'
          & $exe serve
          if ($LASTEXITCODE -ne 0) { throw 'Windows background daemon failed to start' }
          try {
            $status = (& $exe status | Out-String)
            if ($LASTEXITCODE -ne 0 -or $status -notmatch 'running') {
              throw 'Windows process identity check rejected a running daemon'
            }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18788/api/health' -TimeoutSec 8
            if ($health.ok -ne $true) { throw 'Windows daemon did not serve the health endpoint' }
            Write-Host 'PASS: Windows background daemon process identity, status command and API health'
          } finally {
            & $exe stop
            if ($LASTEXITCODE -ne 0) { throw 'Windows daemon stop failed' }
          }
      - name: Run secure and deliberately vulnerable localhost scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/BunnyMind-authz-demo-windows-x64.exe'
          if (-not (Test-Path $exe)) { throw "Windows demo executable missing" }
          $secureRaw = & $exe -json
          if ($LASTEXITCODE -ne 0) { throw "Secure demo exited with $LASTEXITCODE" }
          $secure = ($secureRaw -join "`n") | ConvertFrom-Json
          if ($secure.outcome -ne 'cross_persona_denied_in_lab' -or
              -not $secure.owner_access_observed -or
              -not $secure.foreign_denied_observed -or
              $secure.signed_samples -ne 8) {
            throw "Secure localhost authorization regression failed"
          }
          $vulnerableRaw = & $exe -vulnerable -json
          if ($LASTEXITCODE -ne 0) { throw "Vulnerable demo exited with $LASTEXITCODE" }
          $vulnerable = ($vulnerableRaw -join "`n") | ConvertFrom-Json
          if ($vulnerable.outcome -ne 'cross_persona_marker_observed_in_lab' -or
              -not $vulnerable.owner_access_observed -or
              -not $vulnerable.foreign_marker_observed -or
              $vulnerable.signed_samples -ne 8) {
            throw "Deliberately vulnerable localhost scenario was not detected"
          }
          Write-Host 'PASS: Windows secure fixture denied cross-user access'
          Write-Host 'PASS: Windows deliberately vulnerable fixture exposed synthetic marker'
          Write-Host 'PASS: both scenarios produced eight signed synthetic samples'
          $fixExe = Join-Path $PWD 'dist/BunnyMind-fix-demo-windows-x64.exe'
          if (-not (Test-Path $fixExe)) { throw "Windows fix demo executable missing" }
          $modes = @(
            @{ Mode='remediation'; Expected='remediation_observed_in_lab' },
            @{ Mode='regression'; Expected='regression_observed_in_lab' },
            @{ Mode='persistent'; Expected='unchanged_exposure_in_lab' },
            @{ Mode='denied'; Expected='unchanged_denial_in_lab' }
          )
          foreach ($case in $modes) {
            $raw = & $fixExe -mode $case.Mode -json
            if ($LASTEXITCODE -ne 0) { throw "Fix demo failed for mode $($case.Mode)" }
            $result = ($raw -join "`n") | ConvertFrom-Json
            if ($result.outcome -ne $case.Expected -or
                $result.before_signed_samples -ne 8 -or
                $result.after_signed_samples -ne 8) {
              throw "Fix comparison failed for mode $($case.Mode)"
            }
            Write-Host "PASS: signed local before/after mode $($case.Mode)"
          }
          foreach ($case in $modes) {
            $rawBound = & $fixExe -mode $case.Mode -build-bound -json
            if ($LASTEXITCODE -ne 0) { throw "Build-bound fix demo failed for mode $($case.Mode)" }
            $bound = ($rawBound -join "`n") | ConvertFrom-Json
            if ($bound.comparison.outcome -ne $case.Expected -or
                -not $bound.artifact_measurements_authenticated -or
                $bound.deployment_identity_verified -or
                $bound.before_artifact_sha256 -eq $bound.after_artifact_sha256) {
              throw "Build-bound fix comparison did not enforce distinct signed artifacts for $($case.Mode)"
            }
            Write-Host "PASS: signed synthetic build-bound comparison $($case.Mode)"
          }
          $authExe = Join-Path $PWD 'dist/BunnyMind-authflow-demo-windows-x64.exe'
          if (-not (Test-Path $authExe)) { throw 'Windows authenticated workflow demo missing' }
          foreach ($mode in @('secure','weak')) {
            $arguments = @()
            if ($mode -eq 'weak') { $arguments = @('-weak') }
            $raw = & $authExe @arguments
            if ($LASTEXITCODE -ne 0) { throw "Synthetic signup/OTP demo failed: $mode" }
            $result = ($raw -join "`n") | ConvertFrom-Json
            $expected = 'cross_user_denied_in_synthetic_lab'
            if ($mode -eq 'weak') { $expected = 'cross_user_access_observed_in_synthetic_lab' }
            if ($result.outcome -ne $expected -or
                $result.accounts_created -ne 2 -or
                $result.mail_messages_read -ne 3 -or
                $result.otp_codes_submitted -ne 3 -or
                -not $result.otp_replay_denied -or
                -not $result.distinct_sessions -or
                -not $result.rotation_invalidated_old -or
                -not $result.logout_invalidated -or
                -not $result.anonymous_denied -or
                $result.request_count -gt 28) {
              throw "Synthetic signup/OTP/session test assertion failed: $mode"
            }
            Write-Host "PASS: native Windows synthetic signup, email OTP, session isolation $mode"
          }

  windows-browser-ui-e2e:
    needs: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BunnyMind-windows-x64-ci
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Playwright test client
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Browser regression for real embedded ChatPage and desktop/mobile drawers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe=Join-Path $PWD 'dist/BunnyMind-windows-x64.exe'
          $env:ANTARES_HOME=Join-Path $env:RUNNER_TEMP 'bunnymind-ui-e2e-home'
          $env:ANTARES_HOST='127.0.0.1'
          $env:ANTARES_PORT='18787'
          $env:ANTARES_DISABLE_MODELS_FETCH='1'
          $out=Join-Path $env:RUNNER_TEMP 'bunnymind-ui-server.out'
          $err=Join-Path $env:RUNNER_TEMP 'bunnymind-ui-server.err'
          $server=Start-Process -FilePath $exe -ArgumentList '--foreground' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $healthy=$false
            for($i=0;$i -lt 70;$i++){
              if($server.HasExited){ throw 'BunnyMind exited before browser UI test' }
              try{
                $response=Invoke-RestMethod 'http://127.0.0.1:18787/api/health' -TimeoutSec 2
                if($response.ok -eq $true){$healthy=$true;break}
              }catch{}
              Start-Sleep -Milliseconds 500
            }
            if(-not $healthy){throw 'BunnyMind did not become healthy for browser test'}
            python tests/e2e/chat_sidebar_playwright.py --base http://127.0.0.1:18787 --artifacts dist/ui-regression
            if($LASTEXITCODE -ne 0){throw 'Browser UI regression failed'}
          } finally {
            if(-not $server.HasExited){Stop-Process -Id $server.Id -Force}
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 20
          }
      - name: Upload browser E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BunnyMind-chat-sidebar-ui-e2e
          path: dist/ui-regression/
          retention-days: 14
          if-no-files-found: warn
