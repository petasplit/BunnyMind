name: BunnyMind Foundation CI
on:
  push:
    branches: [main, "bunnymind/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard unit tests
        run: go test ./internal/bunnyguard ./internal/bunnyevidence ./internal/bunnybench ./internal/bunnyharness ./internal/bunnynet ./internal/bunnygraph ./cmd/bunnybench ./internal/tools -count=1
      - name: Verify agent integration
        run: go test ./internal/agent ./internal/config
      - name: Static analysis
        run: go vet ./internal/bunnyguard ./internal/bunnyevidence ./internal/bunnyharness ./internal/bunnynet ./internal/bunnygraph ./internal/tools ./internal/agent ./internal/config
