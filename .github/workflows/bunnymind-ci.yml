name: BunnyMind Foundation CI
on:
  push:
    branches: [main, "bunnymind/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard unit tests
        run: go test ./internal/bunnyguard ./internal/bunnyevidence ./internal/bunnybench ./internal/bunnyharness ./internal/bunnynet ./internal/bunnygraph ./internal/bunnyblackboard ./internal/bunnyplanner ./internal/bunnyreceipt ./cmd/bunnybench ./cmd/bunnyreceipt-recorder ./cmd/bunnybench-signed ./internal/bunnylab ./internal/bunnyauthz ./internal/bunnyfix ./internal/bunnybuild ./cmd/bunnybuild-attest ./cmd/bunnyauthz-demo ./cmd/bunnyfix-demo ./cmd/bunnylab-recorder ./cmd/bunnylab-fixture ./internal/tools -count=1 ./internal/bunnyauthflow ./internal/bunnyidentity ./internal/bunnychallenge ./cmd/bunny-authflow-demo ./internal/bunnyresearch ./internal/bunnytimeline ./internal/bunnyhar ./internal/bunnymatrix ./internal/bunnybrowserflow ./cmd/bunny-browser-auth-demo
      - name: Verify agent integration
        run: go test ./internal/agent ./internal/config
      - name: Static analysis
        run: go vet ./internal/bunnyguard ./internal/bunnyevidence ./internal/bunnyharness ./internal/bunnynet ./internal/bunnygraph ./internal/bunnyblackboard ./internal/bunnyplanner ./internal/bunnyreceipt ./internal/bunnylab ./internal/bunnyauthz ./internal/bunnyfix ./internal/bunnybuild ./cmd/bunnybuild-attest ./cmd/bunnyauthz-demo ./cmd/bunnyfix-demo ./cmd/bunnybench-signed ./cmd/bunnylab-recorder ./cmd/bunnylab-fixture ./internal/tools ./internal/agent ./internal/config ./internal/bunnyauthflow ./internal/bunnyidentity ./internal/bunnychallenge ./cmd/bunny-authflow-demo ./internal/bunnyresearch ./internal/bunnytimeline ./internal/bunnyhar ./internal/bunnymatrix ./internal/bunnybrowserflow

  harness-microbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Bench board persistence and inventory graph
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/bunnyharness ./internal/bunnygraph ./internal/bunnyblackboard \
            -run '^$' -bench '^Benchmark' -benchtime=25x -benchmem \
            | tee bunny-harness-microbench.txt
      - name: Archive reproducible harness measurements
        uses: actions/upload-artifact@v4
        with:
          name: bunny-harness-microbench
          path: bunny-harness-microbench.txt
          retention-days: 30

  browser-auth-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Verify browser network interception and private-persona OTP
        env:
          BUNNY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          go test ./internal/browser ./internal/bunnybrowserflow \
            -run 'TestChromiumNetworkInterceptorBlocksOtherLocalPort|TestChromeLoopbackEmailAndSessionIsolation' \
            -count=1 -timeout 210s -v
