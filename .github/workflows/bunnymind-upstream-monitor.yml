name: BunnyMind - review upstream Antares
on:
  schedule:
    - cron: '13 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare upstream without merging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add antares-upstream https://github.com/enowdev/antares.git
          git fetch --no-tags antares-upstream main
          latest="$(git rev-parse FETCH_HEAD)"
          commits="$(git rev-list --count HEAD..FETCH_HEAD)"
          echo "Upstream head: $latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Unmerged commits: $commits" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$commits" -eq 0 ]]; then exit 0; fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')" != "true" ]]; then exit 0; fi
          title='Review newer upstream Antares commits'
          body="Antares has $commits commits not included in this branch. Latest: https://github.com/enowdev/antares/commit/$latest. Review changes via PR and CI. No automatic merge."
          existing="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Review newer upstream Antares commits") | .number' | head -1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
